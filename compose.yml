services:
  postgres:
    image: postgres:17-alpine
    container_name: gov-assist-postgres
    restart: unless-stopped


    environment:
      POSTGRES_USER: govassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: govassist_db

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data 

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U govassist -d govassist_db
      interval: 10s
      timeout: 5s 
      retries: 5

volumes:
  postgres_data: 

